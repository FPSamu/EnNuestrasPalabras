<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página en proceso</title>
  <meta name="description" content="Estamos preparando algo nuevo. Muy pronto." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="scene">
    <!-- Foco colgante -->
    <div class="lamp" aria-hidden="true">
      <div class="cord"></div>
      <div class="socket"></div>
      <div class="bulb"></div>
    </div>

    <!-- Texto -->
    <h1 class="title">Coming<br />Soon</h1>

    <!-- Sillón -->
    <svg class="chair" viewBox="0 0 220 245" aria-hidden="true">
      <defs>
        <linearGradient id="g-back" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5f5f5f" />
          <stop offset="1" stop-color="#4a4a4a" />
        </linearGradient>
        <linearGradient id="g-seat" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7a7a7a" />
          <stop offset="1" stop-color="#606060" />
        </linearGradient>
        <linearGradient id="g-arm" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#555" />
          <stop offset="1" stop-color="#6a6a6a" />
        </linearGradient>
        <linearGradient id="g-arm-r" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0" stop-color="#555" />
          <stop offset="1" stop-color="#6a6a6a" />
        </linearGradient>
        <linearGradient id="g-leg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8d8d8d" />
          <stop offset="0.45" stop-color="#e6e6e6" />
          <stop offset="1" stop-color="#9a9a9a" />
        </linearGradient>
      </defs>

      <!-- respaldo (marco) -->
      <rect x="26" y="28" width="168" height="110" rx="4" fill="#474747" />
      <!-- cojín del respaldo -->
      <rect x="44" y="0" width="132" height="74" rx="9" fill="url(#g-back)" />
      <path d="M50 70 Q110 78 170 70" stroke="#3e3e3e" stroke-width="2" fill="none" />
      <!-- base frontal -->
      <rect x="28" y="150" width="164" height="62" rx="3" fill="#575757" />
      <!-- cojín del asiento -->
      <rect x="30" y="108" width="160" height="50" rx="9" fill="url(#g-seat)" />
      <rect x="34" y="110" width="152" height="10" rx="5" fill="#888" opacity=".35" />
      <!-- brazos -->
      <rect x="2" y="34" width="34" height="180" rx="6" fill="url(#g-arm)" />
      <rect x="4" y="34" width="30" height="8" rx="4" fill="#808080" opacity=".5" />
      <rect x="184" y="34" width="34" height="180" rx="6" fill="url(#g-arm-r)" />
      <rect x="186" y="34" width="30" height="8" rx="4" fill="#808080" opacity=".5" />
      <!-- patas -->
      <rect x="12" y="212" width="12" height="32" rx="2" fill="url(#g-leg)" />
      <rect x="196" y="212" width="12" height="32" rx="2" fill="url(#g-leg)" />
    </svg>
  </main>
</body>
</html>
